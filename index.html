<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>El Reino de la Química 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}button{font:inherit}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;left:10px;top:10px;z-index:5;display:grid;gap:7px;width:min(330px,58vw);pointer-events:none}.panel{background:rgba(4,14,23,.82);border:1px solid #ffffff30;border-radius:14px;padding:9px 11px}.row{display:flex;justify-content:space-between;font-size:12px}.bar{height:11px;margin-top:6px;border-radius:999px;overflow:hidden;background:#202d39}.fill{height:100%}.life{background:linear-gradient(90deg,#e94155,#ffb45c)}.knowledge{background:linear-gradient(90deg,#27b8d6,#83e7ff)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:#ffffff12;padding:7px;border-radius:9px;text-align:center;font-size:11px}.stat b{display:block;font-size:15px;color:#ffe18a}#menu,#gameover,#quiz{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 30%,rgba(18,75,92,.72),rgba(3,9,15,.95))}.box{width:min(760px,94vw);max-height:92vh;overflow:auto;padding:23px;border-radius:23px;background:rgba(5,14,22,.92);border:1px solid #ffffff30;box-shadow:0 25px 80px #0008}h1{margin:0 0 6px;font-size:clamp(26px,5vw,45px)}.sub{opacity:.75;margin-bottom:18px}.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.char{border:2px solid transparent;border-radius:18px;padding:15px 9px;background:#ffffff12;color:#fff;cursor:pointer}.char.sel{border-color:#ffe18a;background:#ffe18a22}.avatar{width:64px;height:88px;border-radius:28px 28px 18px 18px;margin:0 auto 8px;box-shadow:inset 0 0 0 5px #ffffff22}.primary{border:0;border-radius:14px;padding:13px 24px;font-weight:800;cursor:pointer;background:#f3d46a;color:#17212b}.secondary{border:1px solid #ffffff40;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:#ffffff12;color:#fff}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}#quiz{display:none;z-index:30;background:#02070cdb}#qcat{color:#80e9ff;font-size:13px;font-weight:800;text-transform:uppercase}#qtext{font-size:clamp(18px,3vw,25px);margin:9px 0 16px}.answers{display:grid;gap:9px}.answer{padding:12px 14px;border-radius:13px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;text-align:left}.answer.correct{border-color:#56df8a;background:#3ac56a33}.answer.wrong{border-color:#ff6b79;background:#dc394933}#feedback{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#ffffff12}#gameover{display:none;z-index:35;text-align:center}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.score{padding:12px 6px;border-radius:12px;background:#ffffff12}.score b{display:block;font-size:20px;color:#ffe18a}#touch{position:fixed;inset:0;z-index:10;pointer-events:none}.joy{position:absolute;left:20px;bottom:22px;width:126px;height:126px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff30;pointer-events:auto;touch-action:none}.knob{position:absolute;left:41px;top:41px;width:44px;height:44px;border-radius:50%;background:#ffffff60}.action{position:absolute;right:22px;bottom:32px;width:76px;height:76px;border-radius:50%;border:1px solid #ffffff50;background:#41aadc4d;color:#fff;font-weight:800;pointer-events:auto}#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;background:#040e17c8;padding:7px 12px;border-radius:999px;font-size:12px;white-space:nowrap}@media(pointer:fine){#touch{display:none}}@media(max-width:620px){#hud{width:min(230px,62vw)}.chars{grid-template-columns:1fr}.char{display:grid;grid-template-columns:65px 1fr;align-items:center;text-align:left}.avatar{margin:0;width:48px;height:62px}#hint{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel"><div class="row"><strong>❤️ VIDA</strong><span id="lifeText">1000 / 1000</span></div><div class="bar"><div id="lifeFill" class="fill life" style="width:100%"></div></div></div><div class="panel"><div class="row"><strong>🧪 CONOCIMIENTO</strong><span id="knowledgeText">0 pts</span></div><div class="bar"><div id="knowledgeFill" class="fill knowledge" style="width:0%"></div></div></div><div class="stats"><div class="stat">Preguntas<b id="questionsText">0/0</b></div><div class="stat">Enemigos<b id="killsText">0</b></div><div class="stat">Cofres<b id="chestsText">0</b></div></div></div>
<div id="hint">Cargando personaje 3D…</div>
<div id="touch"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><button id="action" class="action">⚔️</button></div>
<div id="menu"><div class="box" style="text-align:center"><h1>El Reino de la Química 3D</h1><div class="sub">Modelos GLB reales de Quaternius. Selecciona tu personaje.</div><div class="chars"><button class="char sel" data-char="man"><div class="avatar" style="background:linear-gradient(#5aa8ff,#173b79)"></div><strong>Kimi Man</strong><br><small>Adventurer · azul</small></button><button class="char" data-char="woman"><div class="avatar" style="background:linear-gradient(#d18cff,#5b247f)"></div><strong>Kimi Woman</strong><br><small>Witch · violeta</small></button><button class="char" data-char="alt"><div class="avatar" style="background:linear-gradient(#80e5a0,#1d6a42)"></div><strong>Alternative Kim</strong><br><small>Hooded Adventurer · turquesa</small></button></div><div class="actions"><button id="start" class="primary">Entrar al mapa</button></div></div></div>
<div id="quiz"><div class="box"><div id="qcat"></div><div id="qtext"></div><div id="answers" class="answers"></div><div id="feedback"></div><div class="actions"><button id="continueQuiz" class="primary" style="display:none">Continuar explorando</button></div></div></div>
<div id="gameover"><div class="box"><h1>¡Vuelve a intentarlo, campeón!</h1><div class="scoregrid"><div class="score">Conocimiento<b id="goKnowledge">0</b></div><div class="score">Preguntas correctas<b id="goCorrect">0</b></div><div class="score">Enemigos derrotados<b id="goKills">0</b></div></div><div class="actions"><button id="retry" class="primary">Volver a intentar</button><button id="changeChar" class="secondary">Cambiar personaje</button></div></div></div>
<script src="https://cdn.jsdelivr.net/gh/aguilanh4-ui/juego-quimica@main/js/questions.js"></script>
<script type="module" src="./js/game-v4.js"></script>
</body>
</html>
